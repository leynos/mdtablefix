[package]
name = "mdtablefix"
version = "0.6.1"
edition = "2024"
license = "ISC"
repository = "https://github.com/leynos/mdtablefix"
description = """
`mdtablefix` unb0rks and reflows Markdown tables so that each column has a uniform width. When \
the `--wrap` option is used, it also wraps paragraphs and list items to 80 columns."""

[workspace]
members = [".", "test-macros"]
resolver = "3"

[features]
# The command-line interface, on by default so a plain `cargo install mdtablefix`
# or `cargo build` is unchanged. A consumer that only wants the Markdown
# reflowing library turns it off with `default-features = false` and stops
# compiling `ortho_config` and the TOML, `figment` and `serde_json` stack it
# brings in — none of which the library names, so nothing else has to change.
# `serde` is gated with it, though `html5ever` still pulls `serde` in
# transitively; the saving is that this manifest stops naming it. `clap` stays
# unconditional because `src/select/extensions.rs` parses `--md-exts` with it and
# that module is part of the binary's selection tree. The feature is additive on
# purpose: it gates *dependencies*, never `cfg`s, so `--all-features` and
# `--no-default-features` build the same library sources.
default = ["cli"]
cli = ["dep:ortho_config", "dep:serde"]
# Exposes internal inline-wrapping shims and fixtures used only by
# `benches/wrap_observer.rs`. Never enable in production; it is not part of the
# public API and only affects `#[doc(hidden)]` benchmark support code.
bench-internals = []

# Declared rather than left to Cargo's implicit `src/main.rs` discovery, which
# has no way to state a feature requirement. Without `required-features` a
# `--no-default-features` build would try to compile `main.rs` with the
# framework absent and fail at `use ortho_config` rather than at the manifest.
[[bin]]
name = "mdtablefix"
path = "src/main.rs"
required-features = ["cli"]

# Applies to every target: the release workflow publishes one archive shape for
# Linux, macOS and Windows alike, so no per-target override is needed. `bin-dir`
# names the binary at the archive root; `.` resolves to an empty source path and
# makes cargo-binstall refuse the package.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
camino = "1.2.4"
cap-std = { version = "4.0.2", features = ["fs_utf8"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
once_cell = "1"
rayon = "1.11"
similar = "3.2"
html5ever = "0.39.0"
# `markup5ever_rcdom` must stay on the same parser stack as `html5ever`
# because `RcDom` implements `TreeSink` from that shared `markup5ever` line.
markup5ever_rcdom = "0.39.0"
textwrap = "0.16.2"
metrics = "0.24"
# Domain error enums for the binary's file-selection tree. `AGENTS.md` mandates
# a concrete error type over an opaque one, and `thiserror` derives the
# `Display` impl that keeps the diagnostics in one place we own.
thiserror = "2"
tracing = "0.1"
unicode-width = "0.2"
# Layered configuration for the binary's settings, behind the `cli` feature so a
# library-only consumer does not compile it. Default features carry the TOML and
# `serde_json` providers, and the crate does not build without them
# (leynos/ortho-config#627). It is reachable only from binary-only modules, so
# `src/lib.rs` never sees it; see docs/adrs/0014-configuration-layering.md.
ortho_config = { version = "0.10.0", optional = true }
# The derive emits code naming `serde::Serialize` and `serde::de::DeserializeOwned`,
# so the traits must come from a crate this package names directly. Optional for
# the same reason as `ortho_config`: the only code that needs it is the binary's.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
rstest = "0.28"
assert_cmd = "2"
insta = "1.47"
# Only the debugging recorder is wanted, so the default `recency` feature (and
# its clock dependency) stays out of the test build.
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
proptest = "1.11.0"
serde_yaml = "0.9"
tempfile = "3"
libc = "0.2.174"
predicates = "3"
trybuild = "1"
# `no-env-filter` lets integration tests capture tracing events emitted from
# the `mdtablefix` crate; the default filter only records the test crate's own
# events, which would hide the library's instrumentation.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
test-macros = { path = "test-macros" }
googletest = "0.14"
pretty_assertions = "1"
rstest-bdd = "0.6.0"
rstest-bdd-macros = { version = "0.6.0", features = ["strict-compile-time-validation"] }
toml = "1.1.2"
syn = { version = "3.0.3", features = ["full", "visit", "extra-traits"] }
proc-macro2 = "1.0.106"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "wrap_observer"
harness = false
required-features = ["bench-internals"]

[workspace.lints.clippy]
# A lower group priority lets the explicit contract deny override its warning
# level; Cargo does not use table order to resolve overlapping lint settings.
pedantic = { level = "warn", priority = -1 }
# Private helpers carry parsing and layout invariants that public API docs do
# not expose. Check every workspace member so the proc-macro crate cannot
# become an undocumented exception.
missing_docs_in_private_items = "deny"
# Enforce the environment-access policy in every target of every member.
# See `clippy.toml` and `docs/adrs/0012-environment-seam-taxonomy.md`.
disallowed_methods = "deny"
# Keep `#[allow]` from silently defeating the deny above: a suppression must
# be an `#[expect]` carrying a reason, so it warns once it stops applying.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.lints.rust]
# Deny undocumented public items, as the documentation-presence rule (DG-003)
# requires; the clippy table above already covers private ones.
missing_docs = "deny"
# Production kernels select Verus contracts only while the pinned verifier
# compiles their shared source. Cargo must recognise that verifier cfg.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }

[lints]
workspace = true
