name: Coverage (main)

# Main owns both persistent coverage outputs: the CodeScene upload and the
# ratchet baseline. Pull requests generate coverage only for their own local
# ratchet check, in `ci.yml`; they neither publish a report nor contact
# CodeScene.
#
# The split is not only hygiene. CodeScene accepts `cs-coverage upload` for an
# analysed branch, which a pull request head is not, and a pull request from a
# fork cannot read `secrets.CS_ACCESS_TOKEN` at all, so the upload step this
# workflow inherits was inert for forks and unnecessary everywhere else. Caches
# and baselines written on `main` are readable by every pull-request run, so the
# baseline written here is the one those ratchet checks compare against.

'on':
  push:
    branches: [main]
  # A dispatch reads the baseline without advancing it: the shared action
  # publishes a new baseline only on a push to `refs/heads/main`, so a manual
  # run can measure this lane without moving the figure it is measuring.
  workflow_dispatch:

# A run in progress is never cancelled. A cancelled publisher abandons both its
# upload and its ratchet baseline write, so a burst of merges could leave `main`
# with no complete run at all. With cancellation off, a newer push waits for
# the running one and replaces any run still pending, so the newest baseline
# wins. The pull-request lanes cancel superseded runs; this one must not, and
# `make test-workflow-contracts` refuses it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # Ubicloud's cache proxy is scoped by ref, so a pull request's Ubicloud
    # build-test reads a warm main scope only if a main job on Ubicloud
    # writes it. This is that writer. The fork arm never applies on push or
    # dispatch; it is kept so every Ubicloud lane reads the same way.
    # standard-4, not standard-2: on two vCPUs two trybuild compile tests
    # (`compile.rs`) exceed nextest's 180 s allowance, cold and warm (runs
    # 36556931315 and 36558819122); on four they pass.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap, so the job states its own ceiling: twice the 4.6 min
    # of the first standard-4 main run (run 36568808595), rounded up to 10.
    timeout-minutes: 10
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@d99a5e2aeba9c2164a70549f00540d0bd12a573b
        with:
          install-mold: 'true'
      - name: Install ripgrep
        # The suite shells out to `rg`, and `make check-ripgrep` refuses to run
        # without it, so the instrumented run needs the same tool the merge
        # gate installs and at the same pin: a baseline measured with a
        # different ripgrep is not comparable with what the ratchet checks.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --locked ripgrep@15.2.0
      - name: Test and Measure Coverage
        # The same action, format and output path as the pull-request lane, and
        # the same default baseline files, so the figure written here is the
        # figure a pull request is measured against. `with-ratchet` is set on
        # both sides for that reason: this lane is the writer and the
        # pull-request lane the reader, and the action decides which by the
        # event rather than by an input.
        env:
          # One of the two exclusions from the build standard: a coverage build is
          # a measurement, so it takes neither the parallel frontend nor the mold
          # linker. Assigning RUSTFLAGS displaces every `rustflags` table in
          # .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@d99a5e2aeba9c2164a70549f00540d0bd12a573b
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # Whether the token is set, as a plain step output. The expression is
      # evaluated before the shell runs, so this step binds nothing: the token
      # sits in no `env` in this workflow, because the upload action is
      # composite and hands its step's `env` to the nested steps it runs.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # An unset secret leaves the upload out rather than failing the lane,
        # which is what lets a fork of this repository run the workflow at all.
        # The ref conjunct is what keeps the dispatch trigger above from
        # uploading a branch CodeScene does not analyse: the push trigger is
        # restricted to `main`, but a dispatch may name any branch.
        if: ${{ steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main' }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@d99a5e2aeba9c2164a70549f00540d0bd12a573b
        with:
          path: lcov.info
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
