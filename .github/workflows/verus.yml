name: Verus

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, a schedule, or a dispatch, none of which
# has a successor waiting, always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          install-mold: 'true'
      # The shared action installs the Verus release named in
      # `tools/verus/VERSION`, and the Z3 solver beside it, through the pinned
      # rust-prover-tools. It checks the digest in `tools/verus/SHA256SUMS` and
      # caches the verified archives. The Make targets below install nothing.
      - name: Install Verus
        uses: leynos/shared-actions/.github/actions/install-prover-tools@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          tools: verus
          runner-image: ubuntu2404
      - name: Verify proofs
        run: make verus
      - name: Verify the harness rejects false proofs
        run: make verus-selftest
      # The three negative controls. Each mutates one production module and
      # requires the run to fail with that module's own postcondition named, so
      # a proof that still verified would be proved from something other than
      # the property it claims. They reuse the installation above.
      - name: Verify complete Setext assembly rejects a missing separator
        run: make verus-mutation
      - name: Verify the fence mutation is rejected
        run: make verus-fence-mutation
      - name: Verify the compression mutation is rejected
        run: make verus-compression-mutation
