name: Verus

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, a schedule, or a dispatch, none of which
# has a successor waiting, always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VERUS_VERSION: 0.2025.04.19.1b16620

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@2a910bfcfd1ea4216419f9290331785f05b33320
      - name: Cache Verus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .verus/${{ env.VERUS_VERSION }}
          key: verus-${{ runner.os }}-${{ runner.arch }}-${{ env.VERUS_VERSION }}
      - name: Verify proofs
        run: make verus
      - name: Verify the harness rejects false proofs
        run: make verus-selftest
