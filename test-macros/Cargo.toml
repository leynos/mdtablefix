[package]
name = "test-macros"
version = "0.1.0"
edition = "2024"
license = "ISC"
publish = false
description = "Proc-macro helpers for mdtablefix integration tests."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Enforce the environment-access policy in every target of this package.
# See `clippy.toml` and `docs/adrs/0006-environment-seam-taxonomy.md`.
[lints.clippy]
disallowed_methods = "deny"
# Keep `#[allow]` from silently defeating the deny above: a suppression must
# be an `#[expect]` carrying a reason, so it warns once it stops applying.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
