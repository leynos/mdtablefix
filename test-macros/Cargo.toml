[package]
name = "test-macros"
version = "0.1.0"
edition = "2024"
license = "ISC"
publish = false
description = "Proc-macro helpers for mdtablefix integration tests."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# The environment-access policy is denied once in the workspace lint table and
# inherited here. See `clippy.toml` and
# `docs/adrs/0006-environment-seam-taxonomy.md`.
[lints]
workspace = true
